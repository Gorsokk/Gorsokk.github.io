*{box-sizing:border-box;margin:0;padding:0}
html{background:#0d1016}

.hero{padding:56px 0 40px}
.hero h1{font-size:48px;line-height:1.08;letter-spacing:-1px;max-width:780px}

.btn{display:inline-block;background:var(--gold);color:#0d1016;font-weight:700;border-radius:10px;padding:12px 20px;text-decoration:none;margin-right:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
h2{font-size:30px;margin:48px 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px}
.card.gold{border-color:var(--gold2)}
.tag{display:inline-block;font-size:12px;letter-spacing:1.5px;color:#8c95a6;margin-bottom:8px;text-transform:uppercase}
.card h3{font-size:20px;margin-bottom:8px}
.card p{color:var(--mut);font-size:15px}
.card ul{list-style:none;margin-top:10px}
.card li{color:#d7dde8;font-size:15px;padding-left:20px;position:relative}
.card li:before{content:"✓";color:var(--ok);position:absolute;left:0}
.links{margin-top:14px;font-size:15px}
.links a{margin-right:14px}
.promise{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.promise div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:#d7dde8}
.promise b{display:block;color:var(--gold);margin-bottom:4px}
footer{border-top:1px solid var(--line);margin-top:56px;padding:24px 0 40px;color:var(--mut);font-size:14px}
@media (max-width:800px){.grid,.grid3,.promise{grid-template-columns:1fr}.hero h1{font-size:34px}nav a{display:none}}

<script>
let L=(navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en';
function apply(){document.documentElement.lang=L;document.querySelectorAll('[data-en]').forEach(e=>e.innerHTML=e.dataset[L]);document.getElementById('lang').textContent=L==='fr'?'EN':'FR';}
document.getElementById('lang').onclick=()=>{L=L==='fr'?'en':'fr';apply();};
